<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234F46E5'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>N</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nova ERP: HR and operations demo. Employees, attendance, leave requests and org chart." />
    <meta name="theme-color" content="#4F46E5" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nova ERP" />

    <title>Nova ERP · HR Demo</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fafafa; }
      .nova-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fafafa;
        font-family: Arial, sans-serif;
      }
      .nova-boot-content { text-align: center; }
      .nova-boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border: 3px solid #dbe4ea;
        border-top-color: #4F46E5;
        border-radius: 50%;
        animation: nova-boot-spin .75s linear infinite;
      }
      .nova-boot-label {
        margin-top: 16px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
      }
      @keyframes nova-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nova-boot-loader" aria-label="Loading">
        <div class="nova-boot-content">
          <div class="nova-boot-spinner" aria-hidden="true"></div>
          <div class="nova-boot-label">Loading...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
